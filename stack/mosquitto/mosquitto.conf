# การตั้งค่า Mosquitto สำหรับ Checkpoint 3
#
# ⚠️ ค่าตั้งนี้เปิดให้เชื่อมต่อโดยไม่ต้องยืนยันตัวตน ใช้ได้เฉพาะตอนพัฒนา
#    ในเครือข่ายภายในเท่านั้น ก่อนขึ้นระบบจริงต้องเปลี่ยนเป็น
#        allow_anonymous false
#        password_file /mosquitto/config/passwd
#    และพิจารณาเปิด TLS ดู docs/data-pipeline-design.md §9

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# เก็บข้อความ retained และคิวของ QoS 1 ลงดิสก์
# จำเป็นเพราะ topic `status` ตั้ง retained ไว้ ถ้า broker รีสตาร์ทแล้วข้อมูล
# หายไป ระบบจะไม่รู้สถานะของอุปกรณ์จนกว่าจะมี heartbeat รอบถัดไป
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ส่ง log ออกทาง stdout เพื่อให้ `docker compose logs` อ่านได้
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ขนาดข้อความสูงสุด ข้อความ feature อยู่ราว 1.8 kB ส่วน raw snapshot
# ไม่ได้ส่งผ่าน MQTT (เก็บเป็นไฟล์) จึงตั้ง 256 kB เผื่อไว้พอ
message_size_limit 262144

# 🚨 คิวของผู้รับแต่ละราย ค่าเริ่มต้นของ Mosquitto คือ 1,000 ข้อความ
# ถ้าผู้ส่งยิงเร็วกว่าที่ผู้รับประมวลผลไหว ข้อความส่วนเกินจะถูก**ทิ้งเงียบๆ**
# แม้จะใช้ QoS 1 ก็ตาม ซึ่งเจอมาแล้วตอนทดสอบเติมข้อมูลย้อนหลัง
# ตั้งให้สูงขึ้นเป็นกันชน แต่ทางแก้ที่ถูกต้องคือให้ผู้ส่งหน่วงตัวเองเมื่อคิวยาว
# ซึ่งทำไว้แล้วในคลาส Publisher ของ src/service/simulate.py
max_queued_messages 20000
